spring:
  datasource:
    url: jdbc:h2:file:./data/tododb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  h2:
    console:
      enabled: true

server:
  port: 8080