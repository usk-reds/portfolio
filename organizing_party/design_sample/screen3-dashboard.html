<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダッシュボード — 飲み会幹事アプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #F0EDE8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans JP', sans-serif;
  }
</style>
</head>
<body>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const T = {
  accent: '#E8603C',
  accentLight: '#FDF1ED',
  text: '#1A1814',
  textSub: '#6B6560',
  textMuted: '#A8A29C',
  border: '#E4DDD6',
  surface: '#FFFFFF',
  bg: '#FAF8F5',
  green: '#2D8B4E',
  greenLight: '#EBF7EE',
  red: '#E84040',
  redLight: '#FDEAEA',
};

/* ── Dummy data ──────────────────────────────── */
const EVENT = {
  name: '3月の飲み会',
  deadline: '2025年3月10日',
  dates: [
    { id: 1, label: '3/14（金） 19:00' },
    { id: 2, label: '3/15（土） 18:00' },
    { id: 3, label: '3/21（金） 19:30' },
  ],
  venues: [
    {
      id: 1, label: '炭火焼き鳥 とり吉',
      url: 'https://tabelog.com/sample1',
      plans: ['2h飲み放題付 ¥3,500', '3h飲み放題付 ¥4,200'],
    },
    {
      id: 2, label: '個室居酒屋 のぞみ',
      url: 'https://tabelog.com/sample2',
      plans: ['個室コース ¥4,000'],
    },
  ],
};

const MEMBERS = [
  { id:1, name:'田中 花子', attending: true, dates:[1,2], venue:1, note:'早めに終わると嬉しいです' },
  { id:2, name:'鈴木 一郎', attending: true, dates:[2,3], venue:2, note:'' },
  { id:3, name:'佐藤 美咲', attending: false, dates:[], venue:null, note:'所用で欠席します' },
  { id:4, name:'山田 健太', attending: true, dates:[1,3], venue:1, note:'アレルギーあり（甲殻類）' },
  { id:5, name:'伊藤 さくら', attending: null, dates:[], venue:null, note:'' }, // unanswered
  { id:6, name:'中村 拓也', attending: null, dates:[], venue:null, note:'' }, // unanswered
];

/* ── Shared UI ───────────────────────────────── */
function SectionCard({ title, children, style={} }) {
  return (
    <div style={{ background: T.surface, borderRadius: 16, padding: '14px', ...style }}>
      {title && (
        <div style={{ fontSize: 12, fontWeight: 700, color: T.textMuted, letterSpacing: '0.08em', marginBottom: 12 }}>
          {title}
        </div>
      )}
      {children}
    </div>
  );
}

/* ── 回答タブ ─────────────────────────────────── */
function AnswerTab() {
  const [name, setName] = useState('');
  const [attending, setAttending] = useState(null); // true | false | null
  const [selectedDates, setSelectedDates] = useState([]);
  const [selectedVenue, setSelectedVenue] = useState(null);
  const [note, setNote] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const [errors, setErrors] = useState({});

  const toggleDate = (id) => {
    setSelectedDates(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  };

  const handleSubmit = () => {
    const e = {};
    if (!name.trim()) e.name = '名前を入力してください';
    if (attending === null) e.attending = '参加可否を選択してください';
    if (attending && selectedDates.length === 0) e.dates = '日時を選択してください';
    if (attending && selectedVenue === null) e.venue = '店舗を選択してください';
    setErrors(e);
    if (Object.keys(e).length === 0) setSubmitted(true);
  };

  if (submitted) {
    return (
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'100%', gap:16, padding:24 }}>
        <div style={{ width:64, height:64, borderRadius:32, background:T.accent, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 8px 24px rgba(232,96,60,0.35)' }}>
          <svg width="30" height="22" viewBox="0 0 30 22" fill="none">
            <path d="M2 11L11 20L28 2" stroke="white" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>
        <div style={{ textAlign:'center' }}>
          <div style={{ fontSize:18, fontWeight:700, color:T.text }}>回答しました</div>
          <div style={{ fontSize:13, color:T.textSub, marginTop:4 }}>ご回答ありがとうございます</div>
        </div>
        <button onClick={() => { setSubmitted(false); setName(''); setAttending(null); setSelectedDates([]); setSelectedVenue(null); setNote(''); }}
          style={{ marginTop:8, padding:'10px 24px', borderRadius:10, border:`1.5px solid ${T.border}`, background:T.surface, color:T.textSub, fontSize:14, fontWeight:600, cursor:'pointer', fontFamily:'Noto Sans JP, sans-serif' }}>
          別の名前で回答する
        </button>
      </div>
    );
  }

  return (
    <div style={{ paddingBottom: 80 }}>
      {/* Event info */}
      <div style={{ background: T.accent, padding: '16px 16px 14px' }}>
        <div style={{ fontSize: 17, fontWeight: 700, color: '#fff' }}>{EVENT.name}</div>
        <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.75)', marginTop: 3 }}>
          回答期限：{EVENT.deadline}
        </div>
      </div>

      <div style={{ padding: '14px 14px', display: 'flex', flexDirection: 'column', gap: 10 }}>

        {/* 名前 */}
        <SectionCard>
          <div style={{ fontSize: 13, fontWeight: 600, color: T.textSub, marginBottom: 6, display:'flex', alignItems:'center', gap:4 }}>
            お名前
            <span style={{ fontSize:11, color:T.accent, fontWeight:700 }}>必須</span>
          </div>
          <input
            value={name}
            onChange={e => setName(e.target.value)}
            placeholder="例：田中 花子"
            style={{
              width:'100%', height:44, borderRadius:10,
              border:`1.5px solid ${errors.name ? T.red : T.border}`,
              padding:'0 12px', fontSize:15, color:T.text, background:T.bg,
              outline:'none', fontFamily:'Noto Sans JP, sans-serif',
            }}
          />
          {errors.name && <div style={{ fontSize:12, color:T.red, marginTop:4 }}>{errors.name}</div>}
        </SectionCard>

        {/* 参加可否 */}
        <SectionCard>
          <div style={{ fontSize: 13, fontWeight: 600, color: T.textSub, marginBottom: 10, display:'flex', alignItems:'center', gap:4 }}>
            参加可否
            <span style={{ fontSize:11, color:T.accent, fontWeight:700 }}>必須</span>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
            {[
              { val: true, label: '参加', color: T.green, bg: T.greenLight },
              { val: false, label: '不参加', color: T.red, bg: T.redLight },
            ].map(opt => (
              <button
                key={String(opt.val)}
                onClick={() => setAttending(opt.val)}
                style={{
                  height: 48, borderRadius: 12,
                  border: `2px solid ${attending === opt.val ? opt.color : T.border}`,
                  background: attending === opt.val ? opt.bg : T.surface,
                  color: attending === opt.val ? opt.color : T.textMuted,
                  fontSize: 15, fontWeight: 700, cursor: 'pointer',
                  fontFamily: 'Noto Sans JP, sans-serif',
                  transition: 'all 0.15s',
                }}
              >
                {opt.label}
              </button>
            ))}
          </div>
          {errors.attending && <div style={{ fontSize:12, color:T.red, marginTop:6 }}>{errors.attending}</div>}
        </SectionCard>

        {/* 参加時のみ */}
        {attending === true && (
          <>
            {/* 日時 */}
            <SectionCard>
              <div style={{ fontSize: 13, fontWeight: 600, color: T.textSub, marginBottom: 10, display:'flex', alignItems:'center', gap:4 }}>
                参加できる日時
                <span style={{ fontSize:11, color:T.accent, fontWeight:700 }}>複数選択可</span>
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {EVENT.dates.map(d => {
                  const checked = selectedDates.includes(d.id);
                  return (
                    <button key={d.id} onClick={() => toggleDate(d.id)} style={{
                      height:48, borderRadius:12, width:'100%',
                      border:`2px solid ${checked ? T.accent : T.border}`,
                      background: checked ? T.accentLight : T.surface,
                      display:'flex', alignItems:'center', gap:10, padding:'0 14px',
                      cursor:'pointer', fontFamily:'Noto Sans JP, sans-serif',
                      transition:'all 0.15s',
                    }}>
                      <div style={{
                        width:20, height:20, borderRadius:4,
                        border:`2px solid ${checked ? T.accent : T.textMuted}`,
                        background: checked ? T.accent : 'transparent',
                        flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center',
                        transition:'all 0.15s',
                      }}>
                        {checked && <svg width="11" height="8" viewBox="0 0 11 8" fill="none">
                          <path d="M1 4L4 7L10 1" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                        </svg>}
                      </div>
                      <span style={{ fontSize:14, fontWeight:600, color: checked ? T.accent : T.text }}>{d.label}</span>
                    </button>
                  );
                })}
              </div>
              {errors.dates && <div style={{ fontSize:12, color:T.red, marginTop:6 }}>{errors.dates}</div>}
            </SectionCard>

            {/* 店舗 */}
            <SectionCard>
              <div style={{ fontSize: 13, fontWeight: 600, color: T.textSub, marginBottom: 10, display:'flex', alignItems:'center', gap:4 }}>
                希望店舗
                <span style={{ fontSize:11, color:T.accent, fontWeight:700 }}>1択</span>
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {EVENT.venues.map(v => {
                  const sel = selectedVenue === v.id;
                  return (
                    <button key={v.id} onClick={() => setSelectedVenue(v.id)} style={{
                      height:48, borderRadius:12, width:'100%',
                      border:`2px solid ${sel ? T.accent : T.border}`,
                      background: sel ? T.accentLight : T.surface,
                      display:'flex', alignItems:'center', gap:10, padding:'0 14px',
                      cursor:'pointer', fontFamily:'Noto Sans JP, sans-serif',
                      transition:'all 0.15s',
                    }}>
                      <div style={{
                        width:20, height:20, borderRadius:10,
                        border:`2px solid ${sel ? T.accent : T.textMuted}`,
                        background: sel ? T.accent : 'transparent',
                        flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center',
                        transition:'all 0.15s',
                      }}>
                        {sel && <div style={{ width:8, height:8, borderRadius:4, background:'#fff' }} />}
                      </div>
                      <span style={{ fontSize:14, fontWeight:600, color: sel ? T.accent : T.text }}>{v.label}</span>
                    </button>
                  );
                })}
              </div>
              {errors.venue && <div style={{ fontSize:12, color:T.red, marginTop:6 }}>{errors.venue}</div>}
            </SectionCard>

            {/* 特記事項 */}
            <SectionCard>
              <div style={{ fontSize: 13, fontWeight: 600, color: T.textSub, marginBottom: 6 }}>
                特記事項
                <span style={{ fontSize:11, color:T.textMuted, fontWeight:400, marginLeft:6 }}>任意</span>
              </div>
              <textarea
                value={note}
                onChange={e => setNote(e.target.value)}
                placeholder="アレルギー・要望など"
                rows={3}
                style={{
                  width:'100%', borderRadius:10, border:`1.5px solid ${T.border}`,
                  padding:'10px 12px', fontSize:14, color:T.text, background:T.bg,
                  outline:'none', fontFamily:'Noto Sans JP, sans-serif',
                  resize:'none', lineHeight:1.6,
                }}
              />
            </SectionCard>
          </>
        )}
        {/* 店舗情報 */}
        <SectionCard title="候補店舗">
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            {EVENT.venues.map((v, i) => (
              <div key={v.id} style={{
                background: T.bg, borderRadius:12, padding:'12px 12px',
                border:`1px solid ${T.border}`,
              }}>
                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom: v.plans.length > 0 || v.url ? 8 : 0 }}>
                  <span style={{ fontSize:14, fontWeight:700, color:T.text }}>{v.label}</span>
                  <span style={{
                    fontSize:11, fontWeight:700, padding:'2px 8px', borderRadius:20,
                    background:T.accentLight, color:T.accent,
                  }}>店舗{i+1}</span>
                </div>
                {v.plans.length > 0 && (
                  <div style={{ display:'flex', flexDirection:'column', gap:4, marginBottom: v.url ? 8 : 0 }}>
                    {v.plans.map((p, pi) => (
                      <div key={pi} style={{ display:'flex', alignItems:'center', gap:6 }}>
                        <div style={{ width:4, height:4, borderRadius:2, background:T.textMuted, flexShrink:0 }} />
                        <span style={{ fontSize:12, color:T.textSub }}>{p}</span>
                      </div>
                    ))}
                  </div>
                )}
                {v.url && (
                  <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                      <path d="M5 2H2a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1V7" stroke={T.accent} strokeWidth="1.3" strokeLinecap="round"/>
                      <path d="M8 1h3m0 0v3m0-3L5.5 6.5" stroke={T.accent} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                    <span style={{ fontSize:12, color:T.accent, textDecoration:'underline', textDecorationColor:'rgba(232,96,60,0.4)' }}>{v.url}</span>
                  </div>
                )}
              </div>
            ))}
          </div>
        </SectionCard>

      </div>

      {/* CTA */}
      <div style={{
        position:'sticky', bottom:0,
        padding:'10px 14px 24px',
        background:`linear-gradient(to bottom, transparent, ${T.bg} 40%)`,
      }}>
        <button onClick={handleSubmit} style={{
          width:'100%', height:52, borderRadius:14,
          background: T.accent, border:'none', color:'#fff',
          fontSize:16, fontWeight:700, cursor:'pointer',
          fontFamily:'Noto Sans JP, sans-serif',
          boxShadow:'0 4px 16px rgba(232,96,60,0.35)',
        }}>
          回答する
        </button>
      </div>
    </div>
  );
}

/* ── 状況タブ ─────────────────────────────────── */
function StatusTab({ onConfirm }) {
  const answered = MEMBERS.filter(m => m.attending !== null);
  const attending = answered.filter(m => m.attending === true);
  const notAttending = answered.filter(m => m.attending === false);
  const unanswered = MEMBERS.filter(m => m.attending === null);

  // Date tally
  const dateTally = EVENT.dates.map(d => ({
    ...d,
    count: attending.filter(m => m.dates.includes(d.id)).length,
  }));
  const maxDateCount = Math.max(...dateTally.map(d => d.count), 1);

  // Venue tally
  const venueTally = EVENT.venues.map(v => ({
    ...v,
    count: attending.filter(m => m.venue === v.id).length,
  }));
  const maxVenueCount = Math.max(...venueTally.map(v => v.count), 1);

  return (
    <div style={{ paddingBottom:80 }}>
      {/* Event info */}
      <div style={{ background: T.accent, padding: '16px 16px 14px' }}>
        <div style={{ fontSize: 17, fontWeight: 700, color: '#fff' }}>{EVENT.name}</div>
        <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.75)', marginTop: 3 }}>
          回答期限：{EVENT.deadline}
        </div>
      </div>

      <div style={{ padding: '14px 14px', display: 'flex', flexDirection: 'column', gap: 10 }}>

        {/* サマリー */}
        <SectionCard title="回答状況">
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
            {[
              { label:'回答済み', value:`${answered.length}名`, color:T.text },
              { label:'参加', value:`${attending.length}名`, color:T.green },
              { label:'不参加', value:`${notAttending.length}名`, color:T.red },
            ].map(s => (
              <div key={s.label} style={{
                background: T.bg, borderRadius:12, padding:'10px 8px', textAlign:'center',
              }}>
                <div style={{ fontSize:20, fontWeight:700, color:s.color }}>{s.value}</div>
                <div style={{ fontSize:11, color:T.textMuted, marginTop:2 }}>{s.label}</div>
              </div>
            ))}
          </div>
        </SectionCard>

        {/* 日時集計 */}
        <SectionCard title="日時ごとの参加可能人数">
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            {dateTally.map(d => (
              <div key={d.id}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:5 }}>
                  <span style={{ fontSize:13, color:T.text, fontWeight:500 }}>{d.label}</span>
                  <span style={{ fontSize:13, fontWeight:700, color:d.count === maxDateCount ? T.accent : T.textSub }}>
                    {d.count}名
                  </span>
                </div>
                <div style={{ height:8, background:'#F0EDE8', borderRadius:4, overflow:'hidden' }}>
                  <div style={{
                    height:'100%', borderRadius:4,
                    background: d.count === maxDateCount ? T.accent : '#C8C0B8',
                    width:`${(d.count / maxDateCount) * 100}%`,
                    transition:'width 0.6s ease',
                  }} />
                </div>
              </div>
            ))}
          </div>
        </SectionCard>

        {/* 店舗集計 */}
        <SectionCard title="店舗ごとの希望票数">
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            {venueTally.map(v => (
              <div key={v.id}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:5 }}>
                  <span style={{ fontSize:13, color:T.text, fontWeight:500 }}>{v.label}</span>
                  <span style={{ fontSize:13, fontWeight:700, color:v.count === maxVenueCount ? T.accent : T.textSub }}>
                    {v.count}票
                  </span>
                </div>
                <div style={{ height:8, background:'#F0EDE8', borderRadius:4, overflow:'hidden' }}>
                  <div style={{
                    height:'100%', borderRadius:4,
                    background: v.count === maxVenueCount ? T.accent : '#C8C0B8',
                    width:`${(v.count / maxVenueCount) * 100}%`,
                    transition:'width 0.6s ease',
                  }} />
                </div>
              </div>
            ))}
          </div>
        </SectionCard>

        {/* 参加者一覧（参加のみ） */}
        <SectionCard title="参加者一覧">
          {attending.length === 0 ? (
            <div style={{ textAlign:'center', fontSize:13, color:T.textMuted, padding:'12px 0' }}>まだ参加者がいません</div>
          ) : (
            <div style={{ display:'flex', flexDirection:'column', gap:1 }}>
              {attending.map((m, i) => (
                <div key={m.id} style={{
                  padding:'10px 0',
                  borderBottom: i < attending.length-1 ? `1px solid ${T.border}` : 'none',
                }}>
                  <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <div style={{
                      width:32, height:32, borderRadius:16,
                      background: T.accentLight,
                      display:'flex', alignItems:'center', justifyContent:'center',
                      fontSize:13, fontWeight:700, color:T.accent, flexShrink:0,
                    }}>
                      {m.name.charAt(0)}
                    </div>
                    <div style={{ flex:1 }}>
                      <span style={{ fontSize:14, fontWeight:600, color:T.text }}>{m.name}</span>
                      {m.note ? (
                        <div style={{ fontSize:12, color:T.textSub, marginTop:2, lineHeight:1.5 }}>💬 {m.note}</div>
                      ) : null}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </SectionCard>
      </div>

      {/* 確定へ進む（回答期限後のみ） */}
      <div style={{
        position:'sticky', bottom:0,
        padding:'10px 14px 24px',
        background:`linear-gradient(to bottom, transparent, ${T.bg} 40%)`,
      }}>
        <button onClick={onConfirm} style={{
          width:'100%', height:52, borderRadius:14,
          background: T.text, border:'none', color:'#fff',
          fontSize:16, fontWeight:700, cursor:'pointer',
          fontFamily:'Noto Sans JP, sans-serif',
          boxShadow:'0 4px 16px rgba(26,24,20,0.2)',
          display:'flex', alignItems:'center', justifyContent:'center', gap:8,
        }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M13 5l-6 6-3-3" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          確定へ進む
        </button>
        <div style={{ textAlign:'center', fontSize:11, color:T.textMuted, marginTop:6 }}>
          回答期限（{EVENT.deadline}）を過ぎたため表示されています
        </div>
      </div>
    </div>
  );
}

/* ── Dashboard ───────────────────────────────── */
function Dashboard({ onConfirm }) {
  const [tab, setTab] = useState('answer');

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', background:T.bg }}>

      {/* Header */}
      <div style={{
        background: T.surface,
        borderBottom: `1px solid ${T.border}`,
        padding:'56px 16px 0',
        position:'sticky', top:0, zIndex:10,
      }}>
        <div style={{ fontSize:18, fontWeight:700, color:T.text, marginBottom:12 }}>
          3月の飲み会
        </div>
        {/* Tabs */}
        <div style={{ display:'flex', gap:0 }}>
          {[
            { id:'answer', label:'回答' },
            { id:'status', label:'状況' },
          ].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              flex:1, height:40, border:'none', background:'transparent',
              fontSize:14, fontWeight: tab===t.id ? 700 : 500,
              color: tab===t.id ? T.accent : T.textMuted,
              cursor:'pointer', fontFamily:'Noto Sans JP, sans-serif',
              borderBottom: `2.5px solid ${tab===t.id ? T.accent : 'transparent'}`,
              transition:'all 0.15s',
            }}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Tab content */}
      <div style={{ flex:1, overflowY:'auto' }}>
        {tab === 'answer' ? <AnswerTab /> : <StatusTab onConfirm={onConfirm} />}
      </div>
    </div>
  );
}

/* ── App ─────────────────────────────────────── */
function App() {
  const [showConfirm, setShowConfirm] = useState(false);

  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh', padding:24 }}>
      <IOSDevice width={390} height={844} dark={false}>
        <Dashboard onConfirm={() => setShowConfirm(true)} />
      </IOSDevice>

      {/* Note */}
      <div style={{
        position:'fixed', bottom:24, right:24,
        background:T.surface, borderRadius:12, padding:'10px 14px',
        border:`1px solid ${T.border}`, fontSize:12, color:T.textSub,
        maxWidth:220, lineHeight:1.6, boxShadow:'0 4px 16px rgba(0,0,0,0.08)',
      }}>
        💡 「状況」タブで「確定へ進む」を押すと<br/>Screen 4 の確定モーダルへ遷移します
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<div id="root"></div>
</body>
</html>
