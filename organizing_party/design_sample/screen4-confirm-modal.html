<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>確定モーダル — 飲み会幹事アプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #F0EDE8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans JP', sans-serif;
  }
</style>
</head>
<body>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const T = {
  accent: '#E8603C',
  accentLight: '#FDF1ED',
  text: '#1A1814',
  textSub: '#6B6560',
  textMuted: '#A8A29C',
  border: '#E4DDD6',
  surface: '#FFFFFF',
  bg: '#FAF8F5',
  green: '#2D8B4E',
  greenLight: '#EBF7EE',
  red: '#E84040',
};

const CORRECT_PASSWORD = 'kanjipass';

const EVENT = {
  name: '3月の飲み会',
  dates: [
    { id:1, label:'3/14（金） 19:00', count:3 },
    { id:2, label:'3/15（土） 18:00', count:2 },
    { id:3, label:'3/21（金） 19:30', count:3 },
  ],
  venues: [
    { id:1, label:'炭火焼き鳥 とり吉', count:2 },
    { id:2, label:'個室居酒屋 のぞみ', count:1 },
  ],
};

/* ── Step indicator (inside modal) ──────────── */
function StepIndicator({ step }) {
  const steps = [
    { id:'auth', label:'認証' },
    { id:'confirm', label:'選択・確定' },
    { id:'done', label:'通達' },
  ];
  const currentIdx = steps.findIndex(s => s.id === step);
  return (
    <div style={{
      display:'flex', alignItems:'center', justifyContent:'center',
      padding:'14px 20px 0', gap:0,
    }}>
      {steps.map((s, i) => {
        const done = i < currentIdx;
        const active = i === currentIdx;
        return (
          <React.Fragment key={s.id}>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
              <div style={{
                width:28, height:28, borderRadius:14,
                background: done ? T.green : active ? T.accent : T.border,
                display:'flex', alignItems:'center', justifyContent:'center',
                transition:'background 0.2s',
              }}>
                {done ? (
                  <svg width="12" height="9" viewBox="0 0 12 9" fill="none">
                    <path d="M1 4.5L4.5 8L11 1" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                ) : (
                  <span style={{ fontSize:12, fontWeight:700, color: active ? '#fff' : T.textMuted }}>{i+1}</span>
                )}
              </div>
              <span style={{ fontSize:10, fontWeight:600, color: active ? T.accent : done ? T.green : T.textMuted }}>{s.label}</span>
            </div>
            {i < steps.length - 1 && (
              <div style={{
                height:2, width:40, marginBottom:16,
                background: i < currentIdx ? T.green : T.border,
                transition:'background 0.3s',
              }} />
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}


function PasswordStep({ onSuccess }) {
  const [pw, setPw] = useState('');
  const [show, setShow] = useState(false);
  const [error, setError] = useState('');
  const [shake, setShake] = useState(false);
  const inputRef = useRef();

  useEffect(() => { inputRef.current?.focus(); }, []);

  const handleSubmit = () => {
    if (pw === CORRECT_PASSWORD) {
      onSuccess();
    } else {
      setError('パスワードが正しくありません');
      setShake(true);
      setPw('');
      setTimeout(() => setShake(false), 500);
    }
  };

  return (
    <div style={{
      display:'flex', flexDirection:'column', alignItems:'center',
      padding:'40px 24px 32px', gap:24,
    }}>
      {/* Lock icon */}
      <div style={{
        width:64, height:64, borderRadius:32,
        background:'#F0EDE8',
        display:'flex', alignItems:'center', justifyContent:'center',
      }}>
        <svg width="28" height="32" viewBox="0 0 28 32" fill="none">
          <rect x="3" y="14" width="22" height="16" rx="4" fill={T.textSub}/>
          <path d="M8 14V10a6 6 0 0112 0v4" stroke={T.textSub} strokeWidth="2.5" strokeLinecap="round"/>
          <circle cx="14" cy="22" r="2.5" fill="white"/>
        </svg>
      </div>

      <div style={{ textAlign:'center' }}>
        <div style={{ fontSize:18, fontWeight:700, color:T.text }}>幹事パスワードを入力</div>
        <div style={{ fontSize:13, color:T.textSub, marginTop:4, lineHeight:1.6 }}>
          確定操作には幹事パスワードが必要です
        </div>
      </div>

      <div style={{ width:'100%', animation: shake ? 'shake 0.4s ease' : 'none' }}>
        <style>{`
          @keyframes shake {
            0%,100%{transform:translateX(0)}
            20%{transform:translateX(-8px)}
            40%{transform:translateX(8px)}
            60%{transform:translateX(-6px)}
            80%{transform:translateX(6px)}
          }
        `}</style>
        <div style={{ position:'relative' }}>
          <input
            ref={inputRef}
            type={show ? 'text' : 'password'}
            value={pw}
            onChange={e => { setPw(e.target.value); setError(''); }}
            onKeyDown={e => e.key === 'Enter' && handleSubmit()}
            placeholder="パスワード"
            style={{
              width:'100%', height:48, borderRadius:12,
              border:`2px solid ${error ? T.red : T.border}`,
              padding:'0 44px 0 14px', fontSize:16, color:T.text,
              background:T.surface, outline:'none',
              fontFamily:'Noto Sans JP, sans-serif',
              transition:'border-color 0.15s',
            }}
          />
          <button onClick={() => setShow(s=>!s)} style={{
            position:'absolute', right:10, top:'50%', transform:'translateY(-50%)',
            background:'none', border:'none', cursor:'pointer', color:T.textMuted,
            fontSize:12, fontWeight:600, padding:4,
          }}>{show ? '隠す' : '表示'}</button>
        </div>
        {error && (
          <div style={{ fontSize:12, color:T.red, marginTop:5, textAlign:'center' }}>
            {error}
          </div>
        )}
        <div style={{ fontSize:11, color:T.textMuted, marginTop:6, textAlign:'center' }}>
          ヒント: <code>kanjipass</code>
        </div>
      </div>

      <button onClick={handleSubmit} style={{
        width:'100%', height:50, borderRadius:13,
        background: pw ? T.accent : T.border,
        border:'none', color: pw ? '#fff' : T.textMuted,
        fontSize:15, fontWeight:700, cursor: pw ? 'pointer' : 'default',
        fontFamily:'Noto Sans JP, sans-serif',
        transition:'all 0.2s',
        boxShadow: pw ? '0 4px 16px rgba(232,96,60,0.3)' : 'none',
      }}>
        認証する
      </button>
    </div>
  );
}

/* ── Step 2: Confirm Selection ───────────────── */
function ConfirmStep({ onDone }) {
  const maxDateCount = Math.max(...EVENT.dates.map(d => d.count));
  const topDates = EVENT.dates.filter(d => d.count === maxDateCount);
  const autoDate = topDates.length === 1 ? topDates[0].id : null;

  const maxVenueCount = Math.max(...EVENT.venues.map(v => v.count));
  const topVenues = EVENT.venues.filter(v => v.count === maxVenueCount);
  const autoVenue = topVenues.length === 1 ? topVenues[0].id : null;

  const [selDate, setSelDate] = useState(autoDate);
  const [selVenue, setSelVenue] = useState(autoVenue);

  const canConfirm = selDate !== null && selVenue !== null;

  return (
    <div style={{ padding:'24px 20px 8px', display:'flex', flexDirection:'column', gap:20 }}>

      {/* Unlock badge */}
      <div style={{
        display:'flex', alignItems:'center', gap:8,
        background:T.greenLight, borderRadius:10, padding:'8px 12px',
      }}>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="6.5" stroke={T.green} strokeWidth="1.3"/>
          <path d="M4 7l2.5 2.5L10 4.5" stroke={T.green} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
        <span style={{ fontSize:12, fontWeight:600, color:T.green }}>幹事として認証済み</span>
      </div>

      {/* 日時選択 */}
      <div>
        <div style={{ fontSize:13, fontWeight:700, color:T.textSub, marginBottom:8, display:'flex', alignItems:'center', gap:6 }}>
          日時を確定
          {autoDate
            ? <span style={{ fontSize:11, color:T.textMuted, fontWeight:400 }}>最多票を自動選択</span>
            : <span style={{ fontSize:11, color:T.accent, fontWeight:600 }}>同数のため選択してください</span>
          }
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:7 }}>
          {EVENT.dates.map(d => {
            const sel = selDate === d.id;
            const isTop = d.count === maxDateCount;
            return (
              <button key={d.id} onClick={() => setSelDate(d.id)} style={{
                height:52, borderRadius:12, width:'100%',
                border:`2px solid ${sel ? T.accent : T.border}`,
                background: sel ? T.accentLight : T.surface,
                display:'flex', alignItems:'center', justifyContent:'space-between',
                padding:'0 14px', cursor:'pointer',
                fontFamily:'Noto Sans JP, sans-serif',
                transition:'all 0.15s',
              }}>
                <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                  {/* Radio */}
                  <div style={{
                    width:20, height:20, borderRadius:10,
                    border:`2px solid ${sel ? T.accent : T.textMuted}`,
                    background: sel ? T.accent : 'transparent',
                    flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center',
                    transition:'all 0.15s',
                  }}>
                    {sel && <div style={{ width:8, height:8, borderRadius:4, background:'#fff' }} />}
                  </div>
                  <span style={{ fontSize:14, fontWeight:600, color: sel ? T.accent : T.text }}>
                    {d.label}
                  </span>
                </div>
                {/* Vote bar */}
                <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                  {isTop && !autoDate && (
                    <span style={{
                      fontSize:10, fontWeight:700, color:'#fff',
                      background:T.accent, borderRadius:6, padding:'2px 6px',
                    }}>同数</span>
                  )}
                  {isTop && autoDate && (
                    <span style={{
                      fontSize:10, fontWeight:700, color:T.accent,
                      background:T.accentLight, borderRadius:6, padding:'2px 6px',
                    }}>最多</span>
                  )}
                  <span style={{ fontSize:13, fontWeight:700, color: isTop ? T.accent : T.textSub }}>
                    {d.count}名
                  </span>
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* 店舗選択 */}
      <div>
        <div style={{ fontSize:13, fontWeight:700, color:T.textSub, marginBottom:8, display:'flex', alignItems:'center', gap:6 }}>
          店舗を確定
          {autoVenue
            ? <span style={{ fontSize:11, color:T.textMuted, fontWeight:400 }}>最多票を自動選択</span>
            : <span style={{ fontSize:11, color:T.accent, fontWeight:600 }}>同数のため選択してください</span>
          }
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:7 }}>
          {EVENT.venues.map(v => {
            const sel = selVenue === v.id;
            const isTop = v.count === maxVenueCount;
            return (
              <button key={v.id} onClick={() => setSelVenue(v.id)} style={{
                height:52, borderRadius:12, width:'100%',
                border:`2px solid ${sel ? T.accent : T.border}`,
                background: sel ? T.accentLight : T.surface,
                display:'flex', alignItems:'center', justifyContent:'space-between',
                padding:'0 14px', cursor:'pointer',
                fontFamily:'Noto Sans JP, sans-serif',
                transition:'all 0.15s',
              }}>
                <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                  <div style={{
                    width:20, height:20, borderRadius:10,
                    border:`2px solid ${sel ? T.accent : T.textMuted}`,
                    background: sel ? T.accent : 'transparent',
                    flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center',
                    transition:'all 0.15s',
                  }}>
                    {sel && <div style={{ width:8, height:8, borderRadius:4, background:'#fff' }} />}
                  </div>
                  <span style={{ fontSize:14, fontWeight:600, color: sel ? T.accent : T.text }}>
                    {v.label}
                  </span>
                </div>
                <span style={{ fontSize:13, fontWeight:700, color: isTop ? T.accent : T.textSub }}>
                  {isTop && <span style={{ fontSize:10, fontWeight:700, color:T.accent, background:T.accentLight, borderRadius:6, padding:'2px 6px', marginRight:6 }}>最多</span>}
                  {v.count}票
                </span>
              </button>
            );
          })}
        </div>
      </div>

      {/* Confirm button */}
      <button
        onClick={canConfirm ? onDone : undefined}
        style={{
          width:'100%', height:52, borderRadius:14, marginTop:4,
          background: canConfirm ? T.accent : T.border,
          border:'none', color: canConfirm ? '#fff' : T.textMuted,
          fontSize:16, fontWeight:700, cursor: canConfirm ? 'pointer' : 'default',
          fontFamily:'Noto Sans JP, sans-serif',
          boxShadow: canConfirm ? '0 4px 16px rgba(232,96,60,0.35)' : 'none',
          transition:'all 0.2s',
        }}
      >
        確定する
      </button>
    </div>
  );
}

/* ── Step 3: Done ────────────────────────────── */
function DoneStep({ onReset }) {
  const [show, setShow] = useState(false);
  useEffect(() => { setTimeout(() => setShow(true), 100); }, []);

  return (
    <div style={{
      display:'flex', flexDirection:'column', alignItems:'center',
      padding:'48px 24px 32px', gap:16,
      opacity: show ? 1 : 0,
      transform: show ? 'translateY(0)' : 'translateY(12px)',
      transition:'all 0.4s ease',
    }}>
      <div style={{
        width:80, height:80, borderRadius:40,
        background: show ? T.accent : 'transparent',
        display:'flex', alignItems:'center', justifyContent:'center',
        transition:'background 0.4s 0.1s',
        boxShadow: show ? '0 8px 28px rgba(232,96,60,0.4)' : 'none',
      }}>
        <svg width="38" height="28" viewBox="0 0 38 28" fill="none">
          <path d="M3 14L13 24L35 3" stroke="white" strokeWidth="4.5"
            strokeLinecap="round" strokeLinejoin="round"
            strokeDasharray="52" strokeDashoffset={show ? 0 : 52}
            style={{ transition:'stroke-dashoffset 0.45s 0.3s ease-out' }}
          />
        </svg>
      </div>

      <div style={{ textAlign:'center' }}>
        <div style={{ fontSize:22, fontWeight:700, color:T.text }}>確定しました！</div>
        <div style={{ fontSize:14, color:T.textSub, marginTop:6, lineHeight:1.7 }}>
          参加者へ通知する準備をしましょう
        </div>
      </div>

      {/* Summary card */}
      <div style={{
        width:'100%', background:T.bg, borderRadius:14, padding:'14px 16px',
        border:`1.5px solid ${T.border}`, marginTop:4,
      }}>
        {[
          { label:'日時', value:'3/14（金） 19:00' },
          { label:'店舗', value:'炭火焼き鳥 とり吉' },
          { label:'参加人数', value:'3名' },
        ].map((row, i, arr) => (
          <div key={row.label} style={{
            display:'flex', justifyContent:'space-between', alignItems:'center',
            padding:'8px 0',
            borderBottom: i < arr.length-1 ? `1px solid ${T.border}` : 'none',
          }}>
            <span style={{ fontSize:13, color:T.textSub }}>{row.label}</span>
            <span style={{ fontSize:13, fontWeight:700, color:T.text }}>{row.value}</span>
          </div>
        ))}
      </div>

      <button onClick={onReset} style={{
        width:'100%', height:50, borderRadius:13, marginTop:4,
        background: T.surface, border:`1.5px solid ${T.border}`,
        color:T.textSub, fontSize:14, fontWeight:600, cursor:'pointer',
        fontFamily:'Noto Sans JP, sans-serif',
      }}>
        もう一度試す
      </button>
    </div>
  );
}

/* ── Centered Modal ──────────────────────────── */
function ModalSheet({ visible, onClose, children }) {
  return (
    <div style={{
      position:'absolute', inset:0, zIndex:50,
      display:'flex', alignItems:'center', justifyContent:'center',
      padding:'0 16px',
      pointerEvents: visible ? 'all' : 'none',
    }}>
      {/* Backdrop */}
      <div
        onClick={onClose}
        style={{
          position:'absolute', inset:0,
          background:'rgba(0,0,0,0.5)',
          opacity: visible ? 1 : 0,
          transition:'opacity 0.25s',
          backdropFilter:'blur(3px)',
        }}
      />
      {/* Dialog */}
      <div style={{
        position:'relative', zIndex:1,
        background: T.surface,
        borderRadius:24,
        width:'100%',
        maxHeight:'80%',
        overflowY:'auto',
        opacity: visible ? 1 : 0,
        transform: visible ? 'scale(1) translateY(0)' : 'scale(0.93) translateY(12px)',
        transition:'opacity 0.25s, transform 0.25s cubic-bezier(0.34,1.3,0.64,1)',
        boxShadow:'0 24px 64px rgba(0,0,0,0.22)',
      }}>
        {/* Close */}
        <button onClick={onClose} style={{
          position:'absolute', top:12, right:12,
          width:30, height:30, borderRadius:15,
          background:'#F0EDE8', border:'none', cursor:'pointer',
          display:'flex', alignItems:'center', justifyContent:'center',
          color:T.textMuted, fontSize:17, zIndex:2,
        }}>×</button>
        {children}
      </div>
    </div>
  );
}

/* ── Background (status tab) ─────────────────── */
function BackgroundStatus({ onOpen }) {
  const dateTally = EVENT.dates.map(d => d);
  const maxCount = Math.max(...dateTally.map(d => d.count));

  return (
    <div style={{ background:T.bg, minHeight:'100%' }}>
      <div style={{ background:T.accent, padding:'16px 16px 14px' }}>
        <div style={{ fontSize:17, fontWeight:700, color:'#fff' }}>{EVENT.name}</div>
        <div style={{ fontSize:12, color:'rgba(255,255,255,0.75)', marginTop:3 }}>回答期限：2025年3月10日</div>
      </div>

      <div style={{ padding:'14px', display:'flex', flexDirection:'column', gap:10 }}>
        {/* Summary */}
        <div style={{ background:T.surface, borderRadius:16, padding:'14px' }}>
          <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, letterSpacing:'0.08em', marginBottom:10 }}>回答状況</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8 }}>
            {[
              {label:'回答済み', value:'4名', color:T.text},
              {label:'参加', value:'3名', color:T.green},
              {label:'不参加', value:'1名', color:T.red},
            ].map(s=>(
              <div key={s.label} style={{ background:T.bg, borderRadius:12, padding:'10px 8px', textAlign:'center' }}>
                <div style={{ fontSize:20, fontWeight:700, color:s.color }}>{s.value}</div>
                <div style={{ fontSize:11, color:T.textMuted, marginTop:2 }}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Date bars */}
        <div style={{ background:T.surface, borderRadius:16, padding:'14px' }}>
          <div style={{ fontSize:12, fontWeight:700, color:T.textMuted, letterSpacing:'0.08em', marginBottom:12 }}>日時ごとの参加可能人数</div>
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            {dateTally.map(d=>(
              <div key={d.id}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:5 }}>
                  <span style={{ fontSize:13, color:T.text, fontWeight:500 }}>{d.label}</span>
                  <span style={{ fontSize:13, fontWeight:700, color:d.count===maxCount?T.accent:T.textSub }}>{d.count}名</span>
                </div>
                <div style={{ height:8, background:'#F0EDE8', borderRadius:4, overflow:'hidden' }}>
                  <div style={{ height:'100%', borderRadius:4, background:d.count===maxCount?T.accent:'#C8C0B8', width:`${(d.count/maxCount)*100}%` }} />
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Confirm CTA */}
      <div style={{ padding:'4px 14px 0' }}>
        <button onClick={onOpen} style={{
          width:'100%', height:52, borderRadius:14,
          background:T.text, border:'none', color:'#fff',
          fontSize:16, fontWeight:700, cursor:'pointer',
          fontFamily:'Noto Sans JP, sans-serif',
          boxShadow:'0 4px 16px rgba(26,24,20,0.2)',
          display:'flex', alignItems:'center', justifyContent:'center', gap:8,
        }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M13 5l-6 6-3-3" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          確定へ進む
        </button>
        <div style={{ textAlign:'center', fontSize:11, color:T.textMuted, marginTop:6 }}>
          回答期限（2025年3月10日）を過ぎたため表示されています
        </div>

        {/* 操作ガイド */}
        <div style={{
          marginTop:12,
          background:T.surface, borderRadius:14,
          padding:'12px 14px',
          border:`1px solid ${T.border}`,
        }}>
          <div style={{ fontSize:11, fontWeight:700, color:T.textMuted, letterSpacing:'0.06em', marginBottom:8 }}>操作ガイド</div>
          <div style={{ display:'flex', flexDirection:'column', gap:7 }}>
            {[
              { step:'①', text:'パスワードを入力し認証' },
              { step:'②', text:'店舗と日時を選択して確定' },
              { step:'③', text:'参加者に通達' },
            ].map(g => (
              <div key={g.step} style={{ display:'flex', alignItems:'center', gap:10 }}>
                <div style={{
                  width:24, height:24, borderRadius:12, flexShrink:0,
                  background:T.accentLight,
                  display:'flex', alignItems:'center', justifyContent:'center',
                  fontSize:13, fontWeight:700, color:T.accent,
                }}>{g.step}</div>
                <span style={{ fontSize:13, color:T.textSub }}>{g.text}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── App ─────────────────────────────────────── */
function App() {
  const [open, setOpen] = useState(false);
  const [step, setStep] = useState('auth'); // auth | confirm | done

  const handleOpen = () => { setStep('auth'); setOpen(true); };
  const handleClose = () => setOpen(false);
  const handleAuth = () => setStep('confirm');
  const handleConfirm = () => setStep('done');
  const handleReset = () => { setOpen(false); setTimeout(() => setStep('auth'), 400); };

  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh', padding:24 }}>
      <IOSDevice width={390} height={844} dark={false}>
        <div style={{ position:'relative', height:'100%', overflow:'hidden' }}>
          <BackgroundStatus onOpen={handleOpen} />
          <ModalSheet visible={open} onClose={step==='done' ? handleReset : handleClose}>
            {step === 'auth' && (
              <>
                <StepIndicator step="auth" />
                <div style={{ padding:'12px 20px 0', textAlign:'center' }}>
                  <div style={{ fontSize:16, fontWeight:700, color:T.text }}>幹事パスワードを入力</div>
                </div>
                <PasswordStep onSuccess={handleAuth} />
              </>
            )}
            {step === 'confirm' && (
              <>
                <StepIndicator step="confirm" />
                <div style={{ padding:'12px 20px 0', textAlign:'center' }}>
                  <div style={{ fontSize:16, fontWeight:700, color:T.text }}>日時・店舗の確定</div>
                </div>
                <ConfirmStep onDone={handleConfirm} />
              </>
            )}
            {step === 'done' && <><StepIndicator step="done" /><DoneStep onReset={handleReset} /></>}
          </ModalSheet>
        </div>
      </IOSDevice>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<div id="root"></div>
</body>
</html>
